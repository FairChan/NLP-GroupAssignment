<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Toxic Shield Fixture</title>
    <style>
      body {
        margin: 0;
        color: #1f2933;
        font: 14px/1.5 Arial, sans-serif;
        background: #f4f6f8;
      }

      main {
        max-width: 720px;
        margin: 32px auto;
        padding: 0 16px;
      }

      article,
      [data-testid="comment"] {
        margin: 12px 0;
        padding: 12px;
        border: 1px solid #d9e2ec;
        border-radius: 6px;
        background: #ffffff;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Comment Fixture</h1>
      <article data-testid="tweet">
        <div data-testid="tweetText">Thanks for the explanation, this is genuinely helpful.</div>
      </article>
      <article data-testid="tweet">
        <div data-testid="tweetText">You are stupid and I hate you.</div>
      </article>
      <article data-testid="tweet">
        <div data-testid="tweetText">I will hurt you if you come here again.</div>
      </article>
      <article data-testid="tweet">
        <div data-testid="tweetText">People from that group deserve respect and safety.</div>
      </article>
    </main>
  </body>
</html>
